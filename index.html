<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palais Lumen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Cinzel:wght@600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%230f1428%22/%3E%3Cg stroke=%22%23e0b25a%22 stroke-width=%223%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M32 6v10M32 48v10M6 32h10M48 32h10M13.6 13.6l7 7M43.4 43.4l7 7M13.6 50.4l7-7M43.4 20.6l7-7%22/%3E%3C/g%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2213%22 fill=%22%23ffcf7a%22/%3E%3Ccircle cx=%2237%22 cy=%2228%22 r=%2211%22 fill=%22%230f1428%22/%3E%3C/svg%3E">
<style>
  /*
   * The overlay is part of the house: night-blue glass and midnight marble in brass frames,
   * art-deco corner brackets, lamp gold for the one thing that matters. Fonts: Limelight for
   * the house name, Cinzel for headings and big numbers, Barlow Condensed for everything read.
   * Single dark look by design. Painted extras (coin, stone, medal studs) come from
   * src/ui/hudArt.ts and src/ui/hud.ts as --nf-* images.
   */
  :root {
    --ink: #0a0a12;
    --night: #0f1428;
    --night-2: #182042;
    --night-3: #243062;
    --velvet: #4a1226;
    --velvet-hi: #7e1f36;
    --brass: #e0b25a;
    --brass-lo: #a8741f;
    --brass-hi: #fff2c0;
    --lamp: #ffcf7a;
    --cream: #fff6e6;
    --cream-2: #f2e6c9;
    --muted: #b8b2c8;
    --moon: #d8e6ff;
    --jade: #2f7a76;
    --neon: #ff5fa2;
    --stone: #9fe8ff;
    --queen: #c9a0ff;
    --shade: rgba(6,8,20,.9);
    --logo: "Limelight", "Cinzel", Georgia, serif;
    --display: "Cinzel", Georgia, "Times New Roman", serif;
    --body: "Barlow Condensed", "Arial Narrow", sans-serif;
    --hud-h: 0px;
    --press-in: 80ms ease-out;
    --press-out: 120ms cubic-bezier(.34, 1.8, .64, 1);
    --brass-grad: linear-gradient(180deg, #fff2c0 0%, #f2cd72 18%, #c8913a 50%, #a06a22 78%, #6e4614 100%);
    --glass-grad: radial-gradient(120% 90% at 30% 0%, rgba(120,150,230,.22), rgba(0,0,0,0) 60%), linear-gradient(180deg, #1e2a56, #0e1430);
    --velvet-grad: var(--glass-grad);
    --panel-grad: radial-gradient(120% 80% at 20% 0%, rgba(110,140,230,.18), transparent 60%), linear-gradient(180deg, #172046, #0b1027);
    --rail-grad: radial-gradient(60% 140% at 20% 0%, rgba(90,120,210,.16), transparent 70%), linear-gradient(180deg, #141b3a, #0a0e22);
    --well: linear-gradient(180deg, rgba(4,6,16,.55), rgba(10,14,34,.35));
    /* Brass rims: thin for keys, a stepped triple ring for panels and plaques. */
    --rim: inset 0 0 0 1.5px rgba(240,200,104,.85), inset 0 2px 0 1.5px rgba(255,240,200,.16), 0 0 0 1.5px var(--shade), 0 3px 0 rgba(6,8,20,.65), 0 6px 14px rgba(0,0,0,.4);
    --rim-hi: inset 0 0 0 2px #ffd98a, inset 0 2px 0 2px rgba(255,240,200,.2), 0 0 0 1.5px var(--shade), 0 3px 0 rgba(6,8,20,.65), 0 0 20px rgba(255,207,122,.35);
    --frame: inset 0 0 0 2px #c8913a, inset 0 0 0 4px var(--shade), inset 0 0 0 5px rgba(255,220,150,.32);
    /* Art-deco corner brackets as background layers (no pseudo elements needed). */
    --c-br: rgba(255,220,150,.72);
    --brackets: linear-gradient(var(--c-br), var(--c-br)) left 5px top 5px / 9px 2px no-repeat, linear-gradient(var(--c-br), var(--c-br)) left 5px top 5px / 2px 9px no-repeat, linear-gradient(var(--c-br), var(--c-br)) right 5px bottom 5px / 9px 2px no-repeat, linear-gradient(var(--c-br), var(--c-br)) right 5px bottom 5px / 2px 9px no-repeat;
    --c-dk: rgba(90,52,12,.55);
    --brackets-dark: linear-gradient(var(--c-dk), var(--c-dk)) left 5px top 5px / 9px 2px no-repeat, linear-gradient(var(--c-dk), var(--c-dk)) left 5px top 5px / 2px 9px no-repeat, linear-gradient(var(--c-dk), var(--c-dk)) right 5px bottom 5px / 9px 2px no-repeat, linear-gradient(var(--c-dk), var(--c-dk)) right 5px bottom 5px / 2px 9px no-repeat;
    --c-lg: rgba(240,200,104,.8);
    --brackets-lg: linear-gradient(var(--c-lg), var(--c-lg)) left 10px top 10px / 16px 2px no-repeat, linear-gradient(var(--c-lg), var(--c-lg)) left 10px top 10px / 2px 16px no-repeat, linear-gradient(var(--c-lg), var(--c-lg)) right 10px top 10px / 16px 2px no-repeat, linear-gradient(var(--c-lg), var(--c-lg)) right 10px top 10px / 2px 16px no-repeat, linear-gradient(var(--c-lg), var(--c-lg)) left 10px bottom 10px / 16px 2px no-repeat, linear-gradient(var(--c-lg), var(--c-lg)) left 10px bottom 10px / 2px 16px no-repeat, linear-gradient(var(--c-lg), var(--c-lg)) right 10px bottom 10px / 16px 2px no-repeat, linear-gradient(var(--c-lg), var(--c-lg)) right 10px bottom 10px / 2px 16px no-repeat;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--cream); font-family: var(--body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---- Buttons: night glass in a brass rim with deco corners; brass only for the one main action. ---- */
  button {
    font: 700 1.08rem/1 var(--body); letter-spacing: .04em; color: var(--cream);
    min-height: 48px; padding: 0 1.25em; border: 0; border-radius: 4px; cursor: pointer;
    background: var(--brackets), var(--glass-grad);
    box-shadow: var(--rim);
    text-shadow: 0 1px 0 rgba(0,0,0,.6);
    transition: transform var(--press-out), box-shadow .15s, filter .15s;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  button:hover { box-shadow: var(--rim-hi); }
  button:active { transform: scale(.94); transition: transform var(--press-in), box-shadow .08s; }
  button:focus-visible { outline: 3px solid var(--lamp); outline-offset: 3px; }
  button:disabled { filter: saturate(.25) brightness(.7); cursor: default; box-shadow: inset 0 0 0 1.5px rgba(150,150,170,.45), 0 0 0 1.5px var(--shade); }
  button.primary {
    color: #2a1406; text-shadow: 0 1px 0 rgba(255,240,200,.6);
    background: var(--brackets-dark), var(--nf-brass, none) 0 0 / 100% 100%, var(--brass-grad);
    box-shadow: inset 0 0 0 1px rgba(255,248,220,.6), inset 0 -3px 0 rgba(110,70,20,.55), 0 0 0 2px rgba(6,8,20,.92), 0 4px 0 #4a2a0a, 0 8px 18px rgba(0,0,0,.45), 0 0 26px rgba(255,207,122,.32);
  }
  button.primary:hover { filter: brightness(1.08); box-shadow: inset 0 0 0 1px rgba(255,248,220,.8), inset 0 -3px 0 rgba(110,70,20,.55), 0 0 0 2px rgba(6,8,20,.92), 0 4px 0 #4a2a0a, 0 0 32px rgba(255,207,122,.55); }
  button svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .cap { font-family: var(--display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }

  /* ---- HUD: the brass-and-glass instrument rail along the top of the room. ---- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 35;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 12px;
    background: var(--rail-grad);
    box-shadow: inset 0 -1px 0 rgba(255,236,190,.3), 0 3px 0 -1px #a8741f, 0 4px 0 -1px var(--shade), 0 10px 22px rgba(0,0,0,.45);
    transition: opacity .2s;
  }
  #hud::after { /* brass rail along the bottom edge */
    content: ""; position: absolute; left: 0; right: 0; bottom: -3px; height: 3px; pointer-events: none;
    background: var(--brass-grad);
  }
  body.modal-open #hud { opacity: .7; pointer-events: none; }

  .plaque {
    display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; padding: 0 16px 0 7px; border-radius: 6px;
    background: linear-gradient(180deg, #1a2348, #0b1026);
    box-shadow: inset 0 0 0 2px #c8913a, inset 0 0 0 3px var(--shade), inset 0 3px 0 3px rgba(255,236,190,.16), 0 0 0 1.5px var(--shade), 0 4px 10px rgba(0,0,0,.45);
  }
  .plaque small { display: block; font: 600 .74rem/1 var(--body); letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .coin { width: 34px; height: 34px; border-radius: 50%; background-size: cover; flex: none; filter: drop-shadow(0 2px 1px rgba(0,0,0,.6)); }
  .purse.bump .coin { animation: bump .32s cubic-bezier(.34,1.8,.64,1); }
  .purse.bump { animation: glint .6s ease-out; }
  @keyframes bump { 45% { transform: scale(1.28) rotate(-10deg); } }
  @keyframes glint { 0% { filter: brightness(1.35); } 100% { filter: none; } }

  /* Rolling balance: one reel per digit, tabular, rolls with a 50 ms stagger. */
  #balance { font: 700 1.5rem/1 var(--display); color: var(--lamp); display: flex; height: 1em; min-width: 4ch; font-variant-numeric: tabular-nums lining-nums; letter-spacing: .02em; text-shadow: 0 1px 0 #3a1a04, 0 0 10px rgba(255,207,122,.3); transition: text-shadow .3s, color .15s; }
  #balance .reel { display: inline-block; width: .72em; height: 1.1em; margin-top: -.05em; overflow: hidden; text-align: center; -webkit-mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(transparent, #000 22%, #000 78%, transparent); }
  #balance .reel > span { display: block; transition: transform .6s cubic-bezier(.3,1.25,.5,1); will-change: transform; }
  #balance .reel > span > b { display: block; height: 1.1em; line-height: 1.1; font-weight: inherit; }
  #balance .sep { display: inline-block; width: .3em; text-align: center; }
  #balance.up { text-shadow: 0 1px 0 #3a1a04, 0 0 16px rgba(255,207,122,.9); }
  #balance.down { color: #ffb08a; animation: stepback .15s ease-out; }
  @keyframes stepback { 50% { transform: translateX(-3px); } }

  .stones { padding-right: 14px; }
  .stone-ic { width: 30px; height: 30px; background-size: contain; background-repeat: no-repeat; background-position: center; flex: none; }
  .stones.bump .stone-ic { animation: bump .35s cubic-bezier(.34,1.8,.64,1); }
  #stones { font: 700 1.25rem/1 var(--display); color: #dff6ff; font-variant-numeric: tabular-nums lining-nums; text-shadow: 0 0 10px rgba(159,232,255,.35); }

  /* Day goal: a stepped brass gauge with four medal studs and their names underneath. */
  .evening { display: grid; gap: 5px; min-width: 0; flex: 1 1 240px; max-width: 460px; margin: 0 8px; }
  .evening-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 700; font-size: 1rem; line-height: 1.1; white-space: nowrap; }
  #ev-num { color: var(--cream-2); letter-spacing: .07em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; }
  #ev-goal { color: var(--lamp); font-variant-numeric: tabular-nums; }
  #ev-bar { position: relative; height: 14px; margin: 0 12px 13px 4px; }
  .ev-track { position: absolute; inset: 0; border-radius: 8px; overflow: hidden; background: linear-gradient(180deg, #05060f, #161c38); box-shadow: inset 0 2px 3px rgba(0,0,0,.8), 0 0 0 2px #8a5a1a, 0 0 0 3px var(--shade), 0 1px 0 3px rgba(255,236,190,.22); }
  #ev-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 8px 3px 3px 8px; background: linear-gradient(180deg, #fff6d0, #ffd27a 35%, #e09a3a 75%, #8a5216); box-shadow: 0 0 12px rgba(255,207,122,.7); transition: width .8s cubic-bezier(.2,.8,.2,1); }
  .ev-track::after { /* the steps */ content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(6,8,20,.55) 9px 11px); pointer-events: none; }
  .tick { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; z-index: 1; }
  .tick::before { content: ""; position: absolute; inset: 0; background: center / contain no-repeat; filter: grayscale(.85) brightness(.55); transition: filter .4s, transform .4s; }
  .tick.m-bronze::before { background-image: var(--nf-m-bronze); }
  .tick.m-silver::before { background-image: var(--nf-m-silver); }
  .tick.m-gold::before { background-image: var(--nf-m-gold); }
  .tick.m-diamond::before { background-image: var(--nf-m-diamond); }
  .tick.m-diamond { margin-left: -12px; }
  .tick::after { content: attr(data-l); position: absolute; top: 21px; left: 50%; transform: translateX(-50%); font: 700 .68rem/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; pointer-events: none; }
  .tick.m-diamond::after { left: auto; right: -2px; transform: none; }
  .tick.hit::before { filter: drop-shadow(0 0 5px rgba(255,220,140,.95)); }
  .tick.m-diamond.hit::before { filter: drop-shadow(0 0 6px rgba(159,232,255,.95)); }
  .tick.hit::after { color: var(--lamp); }
  .tick.next::before { filter: grayscale(.15) brightness(1); animation: nextmark 1.5s ease-in-out infinite; }
  .tick.next::after { color: var(--cream-2); }
  @keyframes nextmark { 50% { transform: scale(1.18); filter: grayscale(0) brightness(1.15) drop-shadow(0 0 5px rgba(255,220,140,.8)); } }
  .queen { display: none; position: absolute; left: -36px; top: 50%; width: 46px; height: 46px; margin-top: -25px; background: var(--nf-queen) center / contain no-repeat; z-index: 2; }
  #ev-bar.boss { margin-left: 32px; margin-bottom: 0; }
  #ev-bar.boss .queen { display: block; animation: queenflap 2.4s ease-in-out infinite; }
  @keyframes queenflap { 50% { transform: scaleX(.86); } }
  #ev-bar.boss .ev-track { background: linear-gradient(180deg, #0a0820, #1c1a44); box-shadow: inset 0 2px 3px rgba(0,0,0,.8), 0 0 0 2px #8a7ab8, 0 0 0 3px var(--shade), 0 0 14px rgba(201,180,255,.45); }
  #ev-bar.boss #ev-fill { background: linear-gradient(180deg, #ffffff, #d8e6ff 35%, #8ea0d8 70%, #3a4680); box-shadow: 0 0 12px rgba(216,230,255,.75); border-radius: 8px 3px 3px 8px; }
  #ev-bar.boss .tick { display: none; }
  .evening.boss #ev-goal { color: var(--moon); }

  /* Top keys: small glass keys in a brass rim, icon + label. */
  .hud-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; height: 44px; padding: 0 13px 0 11px; font-size: 1rem; position: relative; white-space: nowrap; }
  .hud-btn svg .slash { display: none; }
  .hud-btn[aria-pressed="false"] { color: #9aa0b8; }
  .hud-btn[aria-pressed="false"] svg .slash { display: inline; }
  .hud-btn[aria-pressed="false"] svg .wave { display: none; }
  #btn-back { color: #2a1406; text-shadow: 0 1px 0 rgba(255,240,200,.6); background: var(--brackets-dark), var(--brass-grad); box-shadow: inset 0 0 0 1px rgba(255,248,220,.6), inset 0 -2px 0 rgba(110,70,20,.55), 0 0 0 2px rgba(6,8,20,.92), 0 3px 0 #4a2a0a, 0 0 18px rgba(255,207,122,.35); }
  .hud-btns { display: flex; gap: 10px; margin-left: auto; align-items: center; }
  #hud-more { display: none; }
  #hud.foyer #btn-end { display: none; }
  /* Secondary keys are icons; the label appears as a brass tag on hover and focus. */
  .hud-btn.icon { width: 44px; padding: 0; justify-content: center; }
  .hud-btn.icon .lbl {
    position: absolute; top: calc(100% + 9px); right: 50%; transform: translate(50%, -4px); opacity: 0; pointer-events: none;
    font: 700 .9rem/1 var(--body); color: #2a1406; text-shadow: none; padding: 6px 10px; border-radius: 3px;
    background: var(--brass-grad); box-shadow: 0 0 0 1.5px var(--shade), 0 4px 10px rgba(0,0,0,.5); transition: opacity .15s, transform .15s;
  }
  .hud-btn.icon:hover .lbl, .hud-btn.icon:focus-visible .lbl { opacity: 1; transform: translate(50%, 0); }
  .hud-btns .hud-btn.icon:last-child .lbl { right: 0; transform: translate(0, -4px); }
  .hud-btns .hud-btn.icon:last-child:hover .lbl, .hud-btns .hud-btn.icon:last-child:focus-visible .lbl { transform: none; }
  /* Medium widths: the keys keep the top row, the day gauge gets its own full-width row below. */
  @media (max-width: 1699px) and (min-width: 1101px) {
    #hud { flex-wrap: wrap; row-gap: 6px; padding-bottom: 8px; }
    .evening { order: 10; flex: 1 1 100%; max-width: none; margin: 0; gap: 4px; }
    #ev-bar { margin-right: 12px; }
  }
  @media (max-width: 1440px) and (min-width: 1101px) {
    .hud-btns .hud-btn:not(.icon) { width: 44px; padding: 0; justify-content: center; }
    .hud-btns .hud-btn:not(.icon) .lbl { position: absolute; top: calc(100% + 9px); right: 50%; transform: translateX(50%); opacity: 0; pointer-events: none; font: 700 .9rem/1 var(--body); color: #2a1406; text-shadow: none; padding: 6px 10px; border-radius: 3px; background: var(--brass-grad); box-shadow: 0 0 0 1.5px var(--shade); transition: opacity .15s; }
    .hud-btns .hud-btn:not(.icon):hover .lbl, .hud-btns .hud-btn:not(.icon):focus-visible .lbl { opacity: 1; }
    .plaque small { display: none; }
  }

  /* ---- Toasts: slim brass strips under the HUD with a night-glass face, two at a time. ---- */
  #toasts { position: fixed; left: 50%; top: calc(max(var(--hud-h), env(safe-area-inset-top, 0px)) + 12px); transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; z-index: 34; width: min(calc(100vw - 24px), 520px); pointer-events: none; }
  .toast {
    --cut: 14px; position: relative; display: flex; align-items: center; gap: 10px; max-width: 100%; box-sizing: border-box;
    padding: 9px 26px 9px 16px; font-size: 1.05rem; font-weight: 600; line-height: 1.25; color: var(--cream);
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% 50%, calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 50%);
    background: var(--brass-grad); filter: drop-shadow(0 6px 10px rgba(0,0,0,.55));
    animation: toastin .2s ease-out both; pointer-events: auto;
  }
  .toast::before { /* night-glass face inside the brass edge */
    content: ""; position: absolute; inset: 2px 2px; z-index: -1;
    clip-path: polygon(calc(var(--cut) - 1px) 0, calc(100% - var(--cut) + 1px) 0, 100% 50%, calc(100% - var(--cut) + 1px) 100%, calc(var(--cut) - 1px) 100%, 0 50%);
    background: radial-gradient(120% 120% at 20% 0%, rgba(120,150,230,.2), transparent 60%), linear-gradient(180deg, #1c2650, #0b1027);
  }
  .toast { isolation: isolate; }
  body.modal-open .toast { pointer-events: none; }
  .toast-ic { width: 26px; height: 26px; flex: none; background: var(--nf-coin, none) center / contain no-repeat; margin-left: 4px; }
  .toast.ach-toast .toast-ic { background-image: var(--nf-stone, none); }
  .toast-t { flex: 1; text-wrap: pretty; }
  .toast .count { font: 700 .85rem var(--display); color: var(--lamp); margin-left: 4px; }
  .toast.ach-toast { background: linear-gradient(180deg, #e6fbff, #9fe8ff 30%, #4aa8c8 70%, #1e5a7a); }
  .toast.out { animation: toastout .15s ease-in both; }
  @keyframes toastin { from { opacity: 0; transform: translateY(-10px) scaleX(.94); } }
  @keyframes toastout { to { opacity: 0; transform: translateY(-6px); } }

  /* ---- Modal: a night-glass panel in a stepped brass frame with deco corners. ---- */
  #modal { position: fixed; inset: 0; display: grid; place-items: center; box-sizing: border-box; padding: calc(var(--hud-h) + 14px) 14px calc(env(safe-area-inset-bottom, 0px) + 14px); background: rgba(4,5,14,.6); z-index: 30; animation: fadein .28s ease-out both; }
  #modal .dbg h3 { margin: 14px 0 6px; font-size: .95rem; opacity: .85; }
  #modal .dbg h3:first-of-type { margin-top: 4px; }
  #modal .dbg-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #modal .dbg-row input { width: 9em; min-height: 44px; box-sizing: border-box; padding: 0 10px; font: inherit; border-radius: 4px; border: 1px solid rgba(224,178,90,.6); background: rgba(4,6,18,.6); color: inherit; }
  #modal .dbg-info { margin: 0 0 4px; font-variant-numeric: tabular-nums; }
  /* ---- House controls on the tablet: categories like a trainer, toggles, sliders, search. ---- */
  .card.card-mod { width: min(100%, 940px); }
  #modal .mod .dbg-info { font-size: .98rem; color: var(--cream-2); margin: 0 0 10px; }
  .mod-top { position: sticky; top: 0; z-index: 2; display: grid; gap: 8px; padding: 0 0 8px; background: linear-gradient(180deg, #131a3a 80%, rgba(19,26,58,0)); }
  .mod-status { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: 4px; font: 700 1rem/1.25 var(--body); color: var(--cream-2); background: rgba(4,6,18,.45); box-shadow: inset 0 0 0 1px rgba(224,178,90,.3); }
  .mod-status span { flex: 1; min-width: 0; }

  /* ---- House-tech tablet: brass-framed wall panel; its night-blue glass holds the code pad or the controls. ---- */
  .card.card-tablet {
    --tab-ink: #dfe6f6; --tab-glass: #0c1430;

  .card.card-tablet::after { content: ""; position: absolute; bottom: -26px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff4c2, #d9a648 45%, #7a4e18); box-shadow: 0 0 0 1.5px var(--shade), inset 0 -2px 3px rgba(60,30,0,.5); }

  .card.card-tablet .actions:empty { display: none; }

  .tab-pin { display: grid; justify-items: center; gap: 14px; padding: 6px 0 8px; outline: none; }

  @media (max-width: 420px) { .tab-keys { grid-template-columns: repeat(3, 64px); gap: 10px 16px; } #modal .tab-keys button { width: 64px; height: 64px; } }
  @media (max-height: 560px) { .tab-pin { gap: 8px; } .tab-lock { display: none; } #modal .tab-keys button { width: 54px; height: 54px; font-size: 1.45rem; } .tab-keys { grid-template-columns: repeat(3, 54px); gap: 8px 14px; } }
  #modal.closing { animation: fadeout .18s ease-in both; pointer-events: none; }

  @keyframes fadein { from { opacity: 0; } }

  .card {
    position: relative; box-sizing: border-box; width: min(100%, 580px); max-height: calc(100vh - var(--hud-h) - 28px); max-height: calc(100dvh - var(--hud-h) - 28px - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column;
    border: 0; border-radius: 6px;

    box-shadow: var(--frame), 0 0 0 1.5px var(--shade), 0 24px 60px rgba(0,0,0,.65), 0 0 40px rgba(255,190,110,.08);
    padding: 22px 22px 18px;
    animation: panelin .28s cubic-bezier(.3,1.25,.55,1) both;
  }

  @keyframes panelout { to { opacity: 0; transform: scale(.97); } }
  .card-body { overflow: auto; min-height: 0; padding: 0 6px 2px; margin: 0 -6px; scrollbar-width: thin; scrollbar-color: #a8741f transparent; overscroll-behavior: contain; }
  .card h2 { font: 700 1.3rem/1.2 var(--display); margin: 2px 56px 14px 0; color: var(--lamp); text-wrap: balance; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 2px 0 #2a1404, 0 0 14px rgba(255,207,122,.3); padding-bottom: 12px; background: linear-gradient(90deg, rgba(224,178,90,.85), rgba(224,178,90,.15) 70%, transparent) bottom / 100% 1.5px no-repeat; }
  .card p { font-size: 1.12rem; line-height: 1.4; margin: 0 0 10px; color: var(--cream-2); }

  .slot-info strong { font: 700 .9rem/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: #2a1406; background: var(--brass-grad); border-radius: 3px; padding: 5px 9px 4px; justify-self: start; box-shadow: 0 0 0 1.5px var(--shade); }

  .seat input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 3px; }
  .swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .swatches button { width: 30px; height: 30px; min-height: 0; padding: 0; border-radius: 50%; position: relative; box-shadow: inset 0 3px 4px rgba(255,255,255,.35), inset 0 -3px 4px rgba(0,0,0,.35), 0 0 0 2px var(--shade); }
  .swatches button::after { content: ""; position: absolute; inset: -9px; } /* 48 px touch target */
  .swatches button[aria-pressed="true"] { box-shadow: inset 0 3px 4px rgba(255,255,255,.35), inset 0 -3px 4px rgba(0,0,0,.35), 0 0 0 2px var(--shade), 0 0 0 4px var(--lamp), 0 0 12px rgba(255,207,122,.7); }
  .tag { font: 700 .78rem var(--display); letter-spacing: .1em; text-transform: uppercase; color: #2a1406; background: var(--brass-grad); border-radius: 3px; padding: 4px 10px 3px; box-shadow: 0 0 0 1.5px var(--shade); }
  .season { margin-top: 14px; color: var(--cream-2); font-size: 1.1rem; text-align: center; font-variant-numeric: tabular-nums; }
  #skip-hint { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); left: 50%; transform: translateX(-50%); text-align: center; color: var(--cream-2); font-size: .98rem; pointer-events: none; padding: 8px 16px; border-radius: 4px; background: rgba(6,8,20,.72); box-shadow: inset 0 0 0 1px rgba(224,178,90,.45); white-space: nowrap; }

  /* ---- Playing with friends: group cluster in the HUD, the group strip on the party card, the join card. ---- */
  .mp-hud { position: relative; display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .mp-hud:not([hidden]) + #btn-back { margin-left: 0; }
  .mp-hud:not([hidden]) ~ .hud-btns { margin-left: 0; }
  #hud .mp-dots { display: inline-flex; align-items: center; gap: 5px; min-height: 0; height: 32px; padding: 0 10px; border-radius: 16px; background: rgba(4,6,18,.5); box-shadow: inset 0 0 0 1px rgba(224,178,90,.45), 0 0 0 1.5px var(--shade); }
  .mp-dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: inset 0 2px 2px rgba(255,255,255,.35), inset 0 -2px 2px rgba(0,0,0,.35), 0 0 0 1.5px var(--shade), 0 0 7px color-mix(in srgb, var(--c) 60%, transparent); }
  .mp-dots i.self { box-shadow: inset 0 2px 2px rgba(255,255,255,.35), inset 0 -2px 2px rgba(0,0,0,.35), 0 0 0 1.5px var(--shade), 0 0 0 3px rgba(255,217,138,.9); }
  .mp-pal { position: absolute; top: calc(100% + 10px); right: 0; z-index: 4; width: 250px; padding: 12px; box-sizing: border-box; display: grid; gap: 10px; border-radius: 6px; background: var(--panel-grad); box-shadow: var(--frame), 0 0 0 1.5px var(--shade), 0 12px 24px rgba(0,0,0,.6); animation: panelin .2s cubic-bezier(.3,1.25,.55,1) both; }
  .mp-emos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mp-emos button { min-height: 50px; padding: 0; font: 400 1.6rem/1 "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .mp-lines { display: grid; gap: 6px; }
  .mp-lines button { min-height: 40px; font-size: 1rem; text-align: left; justify-content: flex-start; padding: 0 12px; }
  .mp-group { display: grid; gap: 10px; margin-top: 14px; padding: 12px 14px; border-radius: 6px; background: var(--well); box-shadow: inset 0 2px 6px rgba(0,0,0,.5), inset 0 0 0 1px rgba(224,178,90,.3); }
  .mp-group p { margin: 0; font-size: 1.05rem; line-height: 1.35; color: var(--cream-2); }
  .mp-group p strong { color: var(--lamp); }
  .mp-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
  .mp-row p { flex: 1 1 18em; }
  .mp-group > .mp-leave, .mp-row > button { justify-self: start; }
  .mp-code { display: flex; align-items: baseline; justify-content: center; gap: 14px; padding: 4px 0 2px; }
  .mp-code small { font: 600 .8rem/1 var(--body); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .mp-code strong { font: 700 2.3rem/1 var(--display); letter-spacing: .32em; margin-right: -.32em; color: var(--lamp); text-shadow: 0 2px 0 #2a1404, 0 0 18px rgba(255,207,122,.45); font-variant-numeric: lining-nums; user-select: all; -webkit-user-select: all; }
  .mp-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .mp-btns button { min-height: 44px; font-size: 1rem; }
  .mp-btns .mp-close { color: #ffc4cf; }
  .mp-group p.mp-note { font-size: .98rem; color: var(--muted); text-align: center; }
  .mp-status { margin: 0; min-height: 1.3em; font-size: 1.02rem; line-height: 1.35; color: var(--cream-2); }
  .mp-status.err { color: #ffb4c2; }
  .mp-join .mp-status:empty { min-height: 0; margin-top: -12px; }
  .mp-adv { font-size: .95rem; color: var(--muted); }
  .mp-adv summary { cursor: pointer; min-height: 36px; display: flex; align-items: center; color: var(--muted); letter-spacing: .04em; }
  .mp-adv summary { list-style: none; gap: 8px; }
  .mp-adv summary::-webkit-details-marker { display: none; }
  .mp-adv summary::before { content: ''; width: 0; height: 0; border: 5px solid transparent; border-left: 7px solid var(--brass); border-right: 0; transition: transform .15s; }
  .mp-adv[open] summary::before { transform: rotate(90deg); }
  .mp-adv input { width: 100%; min-height: 42px; box-sizing: border-box; margin: 2px 0 6px; padding: 0 10px; font: 600 1rem var(--body); color: var(--cream); background: rgba(4,6,18,.6); border: 0; border-radius: 4px; box-shadow: inset 0 2px 4px rgba(0,0,0,.6), inset 0 0 0 1px rgba(224,178,90,.4); }
  .mp-adv small { display: block; line-height: 1.3; }
  .mp-join { display: grid; gap: 12px; }
  .mp-join > p:first-child { margin: 0; }
  .mp-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  .mp-fields label { display: grid; gap: 6px; font: 600 .82rem/1 var(--body); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .mp-fields input { min-height: 52px; box-sizing: border-box; width: 100%; padding: 0 12px; border: 0; border-radius: 3px; font: 700 1.2rem var(--body); color: #2a1406; background: var(--brass-grad); box-shadow: 0 0 0 2px var(--shade), inset 0 1px 0 rgba(255,248,220,.7); }
  .mp-fields input::placeholder { color: rgba(42,20,6,.55); }
  .mp-fields input:focus-visible { outline: 3px solid var(--lamp); outline-offset: 3px; }
  .mp-fields .mp-code-in { font: 700 1.6rem var(--display); letter-spacing: .3em; text-transform: uppercase; text-align: center; }
  .mp-join.busy .mp-status { animation: mpwait 1.2s ease-in-out infinite; }
  @keyframes mpwait { 50% { opacity: .55; } }
  .seat.friend canvas { width: 120px; height: 150px; }
  .seat.friend strong { font-size: 1.15rem; color: var(--cream); overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
  .tab-locked .tab-why { margin: 0; max-width: 18em; text-align: center; color: #aebbdc; font-size: 1.05rem; line-height: 1.35; }
  /* A friend in a group: the host settles the day and keeps the saves, the bag of items stays with the host. */
  body.mp-guest #btn-end, body.mp-guest #btn-save, body.mp-guest #btn-bag { display: none !important; }
  @media (max-width: 1100px) {
    .mp-hud { margin-left: auto; }
    #hud .mp-dots { height: 30px; padding: 0 8px; }
    .mp-hud:not([hidden]) ~ #hud-more { margin-left: 0 !important; }
    .mp-key .lbl { display: none; }
    .seat.friend canvas { width: 96px; height: 120px; }
  }
  @media (max-width: 520px) {
    .mp-fields { grid-template-columns: 1fr; }
    .mp-code strong { font-size: 1.9rem; }
  }

  /* ---- Phones: two slim rows, the rarely used keys live in a drop-down. ---- */
  @media (max-width: 1100px) {
    #hud { flex-wrap: wrap; gap: 6px 8px; padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: 6px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
    .plaque { height: 44px; padding: 0 12px 0 5px; gap: 7px; }
    .plaque small { display: none; }
    .coin { width: 28px; height: 28px; }
    #balance { font-size: 1.2rem; }
    .stone-ic { width: 24px; height: 24px; }
    #stones { font-size: 1.05rem; }
    .evening { order: 10; flex-basis: 100%; max-width: none; margin: 0; gap: 3px; }
    .evening-top { font-size: .92rem; }
    #ev-bar { height: 11px; margin-bottom: 12px; }
    .tick { width: 18px; height: 18px; margin: -9px 0 0 -9px; }
    .tick::after { top: 17px; font-size: .62rem; letter-spacing: .08em; }
    .queen { width: 32px; height: 32px; margin-top: -16px; left: -28px; }
    #ev-bar.boss { margin-left: 28px; margin-bottom: 0; }
    .hud-btn { height: 48px; min-height: 48px; }
    #btn-back { margin-left: auto; padding: 0 12px 0 9px; }
    #hud-more { display: inline-flex; width: 48px; padding: 0; justify-content: center; }
    #btn-back:not([hidden]) ~ #hud-more { margin-left: 0; }
    #btn-back[hidden] ~ #hud-more { margin-left: auto; }
    .hud-btns {
      position: absolute; top: calc(100% + 10px); right: 10px; margin: 0; z-index: 3;
      display: grid; gap: 8px; width: 220px; padding: 12px; box-sizing: border-box; max-height: calc(100dvh - var(--hud-h) - 24px); overflow-y: auto; overscroll-behavior: contain;
      border-radius: 6px; background: var(--panel-grad);
      box-shadow: var(--frame), 0 0 0 1.5px var(--shade), 0 12px 24px rgba(0,0,0,.6);
      transform-origin: top right; visibility: hidden; opacity: 0; transform: scale(.92);
      transition: opacity .18s ease-in, transform .18s ease-in, visibility 0s .18s;
    }
    #hud.menu-open .hud-btns { visibility: visible; opacity: 1; transform: none; transition: opacity .2s ease-out, transform .28s cubic-bezier(.3,1.25,.55,1), visibility 0s; }
    .hud-btns .hud-btn, .hud-btns .hud-btn.icon { width: 100%; height: 48px; justify-content: flex-start; padding: 0 14px; gap: 12px; }
    .hud-btns .hud-btn .lbl, .hud-btns .hud-btn.icon .lbl, .hud-btns .hud-btn.icon:last-child .lbl { position: static; opacity: 1; transform: none; background: none; box-shadow: none; padding: 0; color: inherit; font: 700 1.05rem/1 var(--body); text-shadow: 0 1px 0 rgba(0,0,0,.6); }
    #hud.menu-open #hud-more { box-shadow: var(--rim-hi); }

    #toasts { top: calc(max(var(--hud-h), env(safe-area-inset-top, 0px)) + 8px); }
    .toast { font-size: 1rem; padding: 8px 22px 8px 12px; }
    .card { padding: 18px 14px 12px; }
    .card h2 { font-size: 1.1rem; margin-right: 52px; letter-spacing: .1em; }
    .card p { font-size: 1.05rem; }
    .card-x { top: 8px; right: 8px; }
    .actions { gap: 10px; }
    .actions button { flex: 1 1 auto; }
    .slot-btns { width: 100%; }
    .slot-btns button { flex: 1; }
    .ach-item { grid-template-columns: 30px 1fr; }
    .ach-rew { grid-column: 2; }
    .seats { grid-template-columns: 1fr 1fr; }
    .seat.empty:nth-child(n+3) { display: none; }
  }
  @media (max-width: 680px) {
    .menu-btns { grid-template-columns: 1fr; width: min(100%, 400px); gap: 10px; padding: 12px; }
    .menu-btns .big { min-height: 76px; justify-items: center; text-align: center; }
    .menu-btns .big .cap { font-size: 1.4rem; }
    .menu-sub button { min-height: 50px; font-size: 1rem; }
    .pledge { font-size: .9rem; }
  }
  @media (max-width: 370px) { #btn-back .lbl { display: none; } #btn-back { width: 48px; padding: 0; justify-content: center; } .menu-sub button { padding: 0 .5em; font-size: .95rem; } }

  @media (prefers-reduced-motion: reduce) {
    .logo, .tick.next::before, #ev-bar.boss .queen, .menu-btns .big { animation: none; }
    .card, .menu { animation: fadein .2s ease-out both; }
    #modal.closing .card { animation: fadeout .15s ease-in both; }
    .toast, .toast.out { animation-name: fadein; }
    .toast.out { animation-name: fadeout; }
    #balance .reel > span { transition: none; }
    #ev-fill { transition: none; }
    .purse.bump .coin, .stones.bump .stone-ic, #balance.down { animation: none; }
    button, button:active { transition: none; transform: none; }
    .hud-btns { transition: none !important; }
  }
</style>
</head>
<body>
<div id="stage" aria-label="Casino-Spielfläche"></div>

<header id="hud" hidden>
  <div class="purse plaque" title="Deine Lumen">
    <div class="coin" aria-hidden="true"></div>
    <div><div id="balance">0</div><small>Lumen</small></div>
  </div>
  <div class="stones plaque" title="Mondsteine: für Laden, Glücksbringer und Items">
    <div class="stone-ic" aria-hidden="true"></div>
    <div><div id="stones">0</div><small>Mondsteine</small></div>
  </div>
  <div class="evening">
    <div class="evening-top"><span id="ev-num">Tag 1</span><span id="ev-goal"></span></div>
    <div id="ev-bar" role="progressbar" aria-label="Fortschritt zum Tagesziel" aria-valuemin="0" aria-valuemax="300">
      <div class="ev-track"><div id="ev-fill"></div></div>
      <i class="queen" aria-hidden="true"></i>
      <i class="tick m-bronze" style="left:33.33%" title="Bronze: Tagesziel" data-l="Bronze"></i>
      <i class="tick m-silver" style="left:50%" title="Silber: 1,5× Ziel" data-l="Silber"></i>
      <i class="tick m-gold" style="left:66.67%" title="Gold: 2× Ziel" data-l="Gold"></i>
      <i class="tick m-diamond" style="left:100%" title="Diamant: 3× Ziel" data-l="Diamant"></i>
    </div>
  </div>
  <button id="btn-back" class="hud-btn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5M8.5 12H20"/></svg><span class="lbl">Zurück</span></button>
  <button id="hud-more" class="hud-btn" aria-expanded="false" aria-controls="hud-menu" aria-label="Menü"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
  <div class="hud-btns" id="hud-menu">
    <button id="btn-save" class="hud-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="15" rx="2"/><path d="M4 12h16M10 8.3h4M10 15.8h4"/></svg><span class="lbl">Spielstände</span></button>
    <button id="btn-end" class="hud-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 14.6A8 8 0 1 1 9.4 4.5a6.4 6.4 0 0 0 10.1 10.1z"/></svg><span class="lbl">Tag beenden</span></button>
    <button id="btn-photo" class="hud-btn icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h3.2l1.6-2.5h6.4l1.6 2.5H20v10H4z"/><circle cx="12" cy="13" r="3.4"/></svg><span class="lbl">Fotomodus</span></button>
    <button id="btn-haptics" class="hud-btn icon" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="4" width="7" height="16" rx="1.6"/><path class="wave" d="M5.5 9v6M3 10.5v3M18.5 9v6M21 10.5v3"/><path class="slash" d="M3.5 3.5l17 17"/></svg><span class="lbl">Vibration an</span></button>
    <button id="btn-music" class="hud-btn icon" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/><path class="slash" d="M3.5 3.5l17 17"/></svg><span class="lbl">Musik an</span></button>
    <button id="btn-mute" class="hud-btn icon" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="slash" d="M3.5 3.5l17 17"/></svg><span class="lbl">Ton an</span></button>
    <button id="btn-help" class="hud-btn icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.6M12 16.8h.01"/></svg><span class="lbl">Hilfe</span></button>
  </div>
</header>

<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden></div>

<section id="title">
  <div class="menu" id="menu-main">
    <h1 class="logo">Palais Lumen<span>Haus des Lichts</span></h1>
    <div class="menu-btns">
      <button id="m-play" class="primary big"><span class="cap">Spielen</span><small id="title-info"></small></button>
      <div class="menu-sub">
        <button id="m-saves">Spielstände</button>
      </div>
    </div>
    <p class="pledge">In den Regeln jedes Spiels steht offen, wie viel das Haus im Schnitt behält.</p>
    <a class="other-game" href="./cs.html">Zweites Spiel: CS Gambler →</a>
  </div>
  <div class="card lobby" id="menu-lobby" hidden>
    <h2 id="lobby-title">Lobby</h2>
    <div class="seats" id="lobby-seats">
      <div class="seat you">
        <canvas id="lobby-avatar" width="120" height="150" aria-hidden="true"></canvas>
        <label class="sr" for="lobby-name">Dein Name</label>
        <input id="lobby-name" maxlength="14" autocomplete="off" spellcheck="false">
        <div class="swatches" id="sw-color" aria-label="Farbe"></div>
        <div class="swatches" id="sw-skin" aria-label="Hautton"></div>
        <span class="tag" id="lobby-you-tag">Gastgeber</span>
      </div>
    </div>
    <div id="lobby-group"></div>
    <div class="season" id="lobby-info"></div>
    <div class="actions"><button id="lobby-back">Zurück</button><button id="lobby-go" class="primary">Losfahren</button></div>
  </div>
  <div id="skip-hint" hidden>Tippen oder Taste drücken zum Überspringen</div>
</section>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
